name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0
        
    - name: Build & Install
      run: dotnet build
      
    - name: Ensure browsers are installed
      run: pwsh bin/Debug/net6.0/playwright.ps1 install --with-deps
      
    - name: Run tests
      run: dotnet test --logger "trx;LogFileName=test-results.trx" --results-directory test-results
      continue-on-error: true

    - name: Test Reporter
      uses: dorny/test-reporter@v1.9.1
            
    - name: Upload test results and reports
      if: always() # Ensures this step runs even if tests fail
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          test-results/test-results.trx
          report/

name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0

    - name: Build & Install
      run: dotnet build

    - name: Ensure browsers are installed
      run: pwsh bin/Debug/net6.0/playwright.ps1 install --with-deps

    - name: Run tests
      run: dotnet test --logger "trx;LogFileName=test-results.trx" --results-directory test-results
      continue-on-error: true

    - name: Install Allure CLI
      run: npm install -g allure-commandline --save-dev

    # Ensure that old Allure results are cleaned up
    - name: Clean Allure results
      run: rm -rf allure-results

    # Copy the test results and screenshots to the Allure results folder
    - name: Copy test results and screenshots for Allure
      run: |
        mkdir -p allure-results
        cp test-results/*.trx allure-results/
        cp -r screenShot/* allure-results/  # Copy screenshots to allure-results folder

    - name: Generate Allure report
      run: |
        allure generate --single-file --clean -o allure-report

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: allure-report
        path: allure-report

    # Upload screenshots taken during failed steps
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: failedTest.png
        path: allure-results

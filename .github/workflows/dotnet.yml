name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0

    - name: Build & Install
      run: dotnet build

    - name: Ensure browsers are installed
      run: pwsh bin/Debug/net6.0/playwright.ps1 install --with-deps

    - name: Run tests
      run: dotnet test --logger "trx;LogFileName=test-results.trx" --results-directory test-results
      continue-on-error: true

    - name: Generate HTML report with trx2html
      run: |
        docker run --rm \
          -v ${{ github.workspace }}/test-results:/test-results \
          -v ${{ github.workspace }}/report:/report \
          node:18 /bin/sh -c "npm install -g trx2html && trx2html -i /test-results/test-results.trx -o /report/index.html"
      
    - name: Upload HTML report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: html-report
        path: report/index.html

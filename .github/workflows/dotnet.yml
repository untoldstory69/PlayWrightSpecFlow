name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0

    - name: Build & Install
      run: dotnet build

    - name: Ensure browsers are installed
      run: pwsh bin/Debug/net6.0/playwright.ps1 install --with-deps

    - name: Run tests
      run: dotnet test --logger "trx;LogFileName=test-results.trx" --results-directory test-results
      continue-on-error: true

    - name: Install Allure CLI
      run: |
        npm install -g allure-commandline --save-dev
        
# Remove both old allure-results and allure-report to ensure we're generating fresh results
    - name: Clean Allure results and report
      run: |
        rm -rf allure-results
        rm -rf allure-report
        
    - name: Generate Allure report
      run: |
        allure generate test-results --single-file --clean -o allure-report

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: allure-report
        path: allure-report

        # Upload screenshots taken during failed steps
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: failedTest
        path: allure-results/*.png  # Upload all screenshots
